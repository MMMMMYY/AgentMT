      name: untitled_c.c
      content: "// Very simple C program that does nothing\n#include <iostream>\n\
        using namespace std;\nint main() {\n  return 0;\n}\n"
    - type: folder
      name: developing
      content:
      - type: file
        name: simple_python.py
        content: '# The first Python program for many beginners!

          print("Hello, World!")

          '
      - type: folder
        name: folder_in_folder
        content:
        - type: file
          name: inner_file.py
          content: '# The inner file in the folder_in_folder directory

            import json

            import requests

            '
