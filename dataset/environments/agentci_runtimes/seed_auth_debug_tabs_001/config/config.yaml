  api_key: AMI_RULZ
  port: '8000'
  hostname: null
  temperature: null
  max_tokens: null
  host_name_updated_on: null
  custom_actions:
  - click
  - fill
  - dblclick
  - clear
  - select_option
  - drag_and_drop
  - hover
  - go_back
  - go_forward
  - goto
  - scroll
  - mouse_click
  - mouse_dblclick
  - mouse_move
  - mouse_down
  - mouse_up
  - mouse_click
  - mouse_dblclick
  - mouse_drag_and_drop
  - mouse_upload_file
  - keyboard_down
  - keyboard_up
  - keyboard_press
  - keyboard_type
  - keyboard_insert_text
  use_axtree: true
  use_screenshot: true
  use_som: false
  extract_coords: false
  use_history: true
  use_action_history: true
  use_think_history: true
  use_thinking: true
  use_concrete_example: true
  use_abstract_example: true
  prompt_txt:
    system_prompt: null
    output_format: '<action>

      <\action>

      <think>

      <\think>

      '
    think_prompt: null
    think_abstract_example: null
    think_concrete_example: null
    action_prompt: null
    action_abstract_example: "For links, checkboxes, buttons, etc. in the Axtree use\
      \ the following action:\n\n<action>\nclick(\"bid\")\n</action>\n\nFor textbox\
      \ items use:\n\n<action>\nfill(\"bid\", str)\n</action>\n\nFor links, checkboxes,\
      \ buttons, etc. in screenshot format, use the following action:\n<action>\n\
      mouse_click(x: float, y: float, button: Literal['left', 'middle', 'right'] =\
      \ 'left')\n</action>\n\nTo fill in a text box in screenshot format, use:\n<action>\n\
      keyboard_type(text) \n</action>\n\n\nRemember you can only use one action at\
      \ a time. Check the history for more context about which action you already\
      \ took.\n"
    action_concrete_example: "if doing ax tree format, use:\n <action>\n fill(\"4\"\
      , \"my text\")\n </action>\nif doing screenshot format, to click at coordinates\
      \ (612, 455) on the screenshot, use:\n <action>\n mouse_click(x=612, y=455)\n\
      \ </action>\n"
tasks:
  add_meeting_with_dennis:
    _target_: open_apps.tasks.tasks.AddEventTask
    goal: Go to the Calendar app and add my meeting with Dennis on April 1st of 2026.
      The title should be 'Dennis-Bob'
    title: Dennis-Bob
    date: '2026-04-01'
    description: null
    location: null
    url: null
    invitees: []
  add_christmas_shopping_event:
    _target_: open_apps.tasks.tasks.AddEventTask
    goal: Make a calendar entry for Christmas shopping on the 14th (2025). The title
      should read 'Shopping for Christmas gifts'.
    title: Shopping for Christmas gifts
    date: '2025-12-14'
    description: null
    location: null
    url: null
    invitees: []
  add_paper_reading_meeting_with_einstein:
    _target_: open_apps.tasks.tasks.AddEventTask
    goal: Go to the Calendar app and add my meeting with Einstein on April 1st of
      2027. The title should be 'Einstein-Bob'. Set the description as 'paper reading',
      omit the URL and set the location to New York City. Make sure to add Einstein
      as an invitee.
    title: Einstein-Bob
    date: '2027-04-01'
    description: paper reading
    location: New York City
    url: null
    invitees:
    - Einstein
  remove_wacv_abstract_deadline:
    _target_: open_apps.tasks.tasks.RemoveEventTask
    goal: Remove the WACV 2026 Abstract Deadline event from my calendar.
    title: WACV 2026 Abstract Deadline
    date: '2025-07-11'
  add_call_mom_to_my_todo:
    _target_: open_apps.tasks.tasks.AddToDoTask
    goal: Add 'Call Mom' to my todo list.
    todo_name: Call Mom
    is_done: false
  mark_water_plants_as_done:
    _target_: open_apps.tasks.tasks.MarkToDoDoneTask
    goal: Mark 'Water plants' as done in my todo list.
    todo_name: Water plants
  message_bob_to_meet:
    _target_: open_apps.tasks.tasks.SendMessageTask
    goal: Send a message to Bob 'Let's meet'
    to: Bob
    message: Let's meet
    expected_reply: Yes, let's play on Saturday!
  save_paris_to_my_favorite_places:
    _target_: open_apps.tasks.tasks.SavePlaceTask
    goal: Save Paris, France to my favorite places
    name: Paris, Île-de-France, France métropolitaine, France
    latitude: 48.8589
    longitude: 2.32
